name: Build Mac app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Give this build its own version number
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version
      - name: Build DMGs (Apple Silicon and Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Copy DMGs to fixed names
        run: |
          cp dist/OrderTrack-*-arm64.dmg dist/OrderTrack-arm64.dmg
          cp dist/OrderTrack-*-x64.dmg dist/OrderTrack-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OrderTrack-mac
          path: |
            dist/OrderTrack-arm64.dmg
            dist/OrderTrack-x64.dmg
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/OrderTrack-arm64.dmg dist/OrderTrack-x64.dmg \
            --target "${{ github.sha }}" \
            --title "OrderTrack for Mac, version 1.1.${{ github.run_number }}" \
            --notes "Easiest install or update: paste this into Terminal: bash <(curl -fsSL https://raw.githubusercontent.com/Zebra0723/OrderTrack/${{ github.ref_name }}/scripts/install-mac.sh)

          Or download OrderTrack-arm64.dmg for Apple Silicon Macs (M1 and later) or OrderTrack-x64.dmg for Intel Macs. Version 1.1.${{ github.run_number }}, built from ${{ github.sha }}."
