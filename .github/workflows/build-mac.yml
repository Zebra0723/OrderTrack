name: Build Mac app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build DMGs (Apple Silicon and Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OrderTrack-mac
          path: dist/*.dmg
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.dmg \
            --target "${{ github.sha }}" \
            --title "OrderTrack for Mac (latest build)" \
            --notes "Download the arm64 DMG for Apple Silicon Macs (M1 and later) or the x64 DMG for Intel Macs. Built from ${{ github.sha }}."
