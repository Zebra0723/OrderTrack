<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Invoice</title>
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/index.css">
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/instrument-sans/index.css">
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    body { font-family: 'Instrument Sans Variable', -apple-system, sans-serif; color: #1A1D29; font-size: 10.5pt; line-height: 1.45; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .inv { width: 210mm; min-height: 297mm; padding: 18mm 18mm 16mm; position: relative; }
    .inv::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: #FF6B5A; }
    .inv.hack::before { background: #F5A524; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 14mm; }
    .biz { font-family: 'Fraunces Variable', Georgia, serif; font-size: 22pt; font-weight: 600; letter-spacing: -0.02em; }
    .addr { color: #6E707A; font-size: 9.5pt; margin-top: 4px; }
    .title { text-align: right; }
    h1 { font-family: 'Fraunces Variable', Georgia, serif; font-weight: 500; font-size: 30pt; margin: 0; letter-spacing: -0.02em; color: #1A1D29; }
    .stamp { display: inline-block; margin-top: 6px; border: 2px solid #2B7A57; color: #2B7A57; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 10pt; padding: 3px 12px; border-radius: 6px; transform: rotate(-4deg); }
    .meta { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 16px; padding: 12px 0 14px; border-top: 1px solid #ECE4D7; border-bottom: 1px solid #ECE4D7; margin-bottom: 10mm; }
    .meta span { display: block; font-size: 8pt; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #868892; margin-top: 6px; }
    .meta span:first-child { margin-top: 0; }
    .meta b { font-weight: 600; }
    .meta .sm { color: #464A58; font-size: 9.5pt; }
    .mono { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 8pt; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #868892; padding: 0 0 8px; border-bottom: 1px solid #DDD2C1; }
    .r { text-align: right; font-variant-numeric: tabular-nums; }
    .items td { padding: 11px 0; border-bottom: 1px solid #ECE4D7; vertical-align: top; }
    .items td.r { width: 30mm; font-weight: 600; }
    .items b { font-weight: 600; }
    .sub { color: #6E707A; font-size: 9pt; margin-top: 2px; }
    .totals { width: 80mm; margin: 8px 0 0 auto; }
    .totals td { padding: 5px 0; color: #464A58; }
    .totals .grand td { padding-top: 10px; border-top: 2px solid #1A1D29; color: #1A1D29; font-family: 'Fraunces Variable', Georgia, serif; font-size: 16pt; font-weight: 600; }
    .pay { margin-top: 12mm; }
    h2 { font-family: 'Fraunces Variable', Georgia, serif; font-size: 13pt; font-weight: 600; margin: 0 0 4px; }
    .pay p { margin: 0 0 8px; color: #464A58; }
    .sched td { padding: 6px 0; border-bottom: 1px solid #F2ECE2; }
    .sched .ok { color: #2B7A57; font-weight: 600; }
    .howto { margin-top: 10px; padding: 10px 12px; background: #FAF6EF; border-radius: 8px; font-size: 9.5pt; }
    .howto span { display: block; font-size: 8pt; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: #868892; margin-bottom: 3px; }
    footer { position: absolute; left: 18mm; right: 18mm; bottom: 14mm; padding-top: 10px; border-top: 1px solid #ECE4D7; color: #868892; font-size: 9pt; text-align: center; }
  </style>
</head>
<body></body>
</html>
